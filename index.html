    <!-- Google tag (gtag.js).
         ACHTUNG: Conversion-ID und Labels stammen noch vom Ursprungsprojekt.
         Vor dem Live-Gang durch die eigene AW-ID dieser Seite ersetzen —
         hier und in src/conversions.ts —, sonst laufen die Conversions in
         das falsche Google-Ads-Konto.

         Der Stub läuft inline und sofort: er definiert gtag() und stellt jeden
         Aufruf in dataLayer, damit Conversions, die vor dem Eintreffen des
         Remote-Tags feuern, erhalten bleiben und nachgespielt werden. So darf
         das 100 KB große gtag.js warten — als allererstes Element im <head>
         würde der Preload-Scanner es vor Fonts und App-Bundle laden und die
         ersten Roundtrips des Besuchs an ein Skript verschenken, das nichts
         zeichnet. Es wird geladen, was zuerst eintritt: window load oder das
         erste Anzeichen eines Nutzers, der konvertieren könnte. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18345460239');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18345460239';
          document.head.appendChild(s);
        }
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        events.forEach(function (e) {
          window.addEventListener(e, loadGtag, {once: true, passive: true, capture: true});
        });
        if (document.readyState === 'complete') loadGtag();
        else window.addEventListener('load', loadGtag, {once: true});
      })();
    </script>
