      // src/main.tsx) — nicht nach fester Zeit. MIN_MS verhindert nur, dass er

      // Rueckfalloption: scheitert das Bundle, bleibt niemand vor einem
      // dunklen Bildschirm sitzen.
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN_MS = reduced ? 0 : 1600;
        var born = Date.now();
        var gone = false;
        function drop() {
          if (gone) return;
          gone = true;
          setTimeout(function () {
            el.className = 'out';
            setTimeout(function () {
              el.parentNode && el.parentNode.removeChild(el);
              document.documentElement.classList.remove('splashing');
            }, reduced ? 0 : 560);
          }, Math.max(0, MIN_MS - (Date.now() - born)));
        }
        window.addEventListener('app-ready', drop, { once: true });
        setTimeout(drop, 8000);
      })();
    </script>
